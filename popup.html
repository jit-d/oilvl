
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 14px;
      font-family: Arial, sans-serif;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 9px;
      margin: 6px 0 12px;
    }
    button {
      padding: 10px;
      width: 100%;
      cursor: pointer;
    }
    small { color: #666; }
  </style>
</head>
<body>
  <h3>Nuvama NIFTY Tracker</h3>

  <label>Google Apps Script Web App URL</label>
  <input id="url" placeholder="https://script.google.com/macros/s/...">

  <label>Security token</label>
  <input id="token" placeholder="Your secret token">

  <button id="save">Save settings</button>

  <p id="status"></p>
  <small>Monitoring runs only while the Nuvama tab is open.</small>

  <script src="popup.js"></script>
</body>
</html>
